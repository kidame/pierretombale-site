<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="Visuel provisoire : aplat de granit gris">
  <!-- Visuel PROVISOIRE : un aplat de granit gris, sans photographie. Thomas
       fournira les visuels plus tard ; il suffira de les deposer dans
       src/assets et de les lister dans `images:` de la fiche concernee. -->
  <defs>
    <linearGradient id="aplat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e8d88"/>
      <stop offset="1" stop-color="#6d6c68"/>
    </linearGradient>
    <!-- Grain du granit : un bruit doux, en niveaux de gris. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="bruit"/>
      <feColorMatrix in="bruit" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.22" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#aplat)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.55"/>
  <rect x="0" y="0" width="1600" height="1200" fill="none" stroke="#5c5b57" stroke-width="2"/>
</svg>
