<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PT">
  <!-- Monogramme sobre "PT", trace a la regle : pas de police embarquee, donc
       le rendu est le meme partout. Suit le theme clair/sombre du systeme. -->
  <style>
    rect {
      fill: #101010;
    }
    @media (prefers-color-scheme: dark) {
      rect {
        fill: #f4f4f2;
      }
    }
  </style>
  <!-- P : hampe, barre haute, flanc droit, barre du milieu -->
  <rect x="8" y="12" width="7" height="40" />
  <rect x="15" y="12" width="15" height="7" />
  <rect x="23" y="12" width="7" height="18" />
  <rect x="15" y="23" width="15" height="7" />
  <!-- T : barre haute et hampe -->
  <rect x="34" y="12" width="22" height="7" />
  <rect x="41" y="12" width="7" height="40" />
</svg>
